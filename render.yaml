services:
  - type: web
    name: echotext-backend
    env: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PUBLIC_BASE_URL
        value: https://echotext-backend.onrender.com
      - key: CORS_ORIGINS
        value: https://echotext.vercel.app,https://echotext.gh,http://localhost:3000,http://localhost:3001
